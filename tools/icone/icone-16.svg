<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="ceu" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1fa0e8"/><stop offset=".55" stop-color="#0a62c0"/><stop offset="1" stop-color="#0747a0"/>
    </linearGradient>
    <linearGradient id="campo" x1="1" y1="0" x2=".15" y2="1">
      <stop offset="0" stop-color="#6cbf3a"/><stop offset=".5" stop-color="#2f9f45"/><stop offset="1" stop-color="#078a4c"/>
    </linearGradient>
    <!-- the finger edge is drawn only where it crosses the receipt, then fades into the fingers -->
    <linearGradient id="dedos" gradientUnits="userSpaceOnUse" x1="80.3" y1="86" x2="95.5" y2="75.6">
      <stop offset="0" stop-color="#0b4ea2"/><stop offset=".45" stop-color="#0b4ea2"/><stop offset="1" stop-color="#0b4ea2" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="pulso" gradientUnits="userSpaceOnUse" x1="37.5" y1="72.5" x2="10" y2="85.5">
      <stop offset="0" stop-color="#0b4ea2"/><stop offset=".3" stop-color="#0b4ea2"/><stop offset="1" stop-color="#0b4ea2" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="c"><rect x="4" y="4" width="120" height="120" rx="26"/></clipPath>
  </defs>
  <g clip-path="url(#c)">
    <rect width="128" height="128" fill="url(#ceu)"/>
    <path d="M0 82 C 30 70 80 58 128 65" fill="none" stroke="#f2e01c" stroke-width="16"/>
    <path d="M0 82 C 30 70 80 58 128 65 V128 H0 Z" fill="url(#campo)"/>
  </g>
  <!-- receipt: torn along the top, tucked into the hand at the bottom -->
  <path d="M36 90 V14 L50 22 L64 14 L78 22 L92 14 V90 Z"
        fill="#ffffff" stroke="#ffffff" stroke-width="1.6" stroke-linejoin="round"/>
  <g fill="#5596e6"></g>
  <path d="M64.0 66.0 C 49.5 55.7 42.0 46.2 42.0 38.3 C 42.0 32.6 46.4 28.0 53.0 28.0 C 58.3 28.0 62.2 31.0 64.0 35.6 C 65.8 31.0 69.7 28.0 75.0 28.0 C 81.6 28.0 86.0 32.6 86.0 38.3 C 86.0 46.2 78.5 55.7 64.0 66.0 Z" fill="#e8313f"/>
  <!-- hand, palm up; its edge over the receipt is drawn, since white meets white there -->
  <g clip-path="url(#c)">
    <path d="M-4 93
             C 1 90.5 6 88.5 10 85.5
             C 20 78 30 72.5 37.5 72.5
             C 45 72.5 51 77 57 80
             C 62 82.3 70 82 75 83
             C 77.5 83.6 79.3 84.8 80 86.3
             L 94 76.8
             C 97 74.5 101.5 74.2 103.4 76.8
             C 105 79 104.3 81.8 102.4 83.8
             C 96.5 90 90 96 83.5 100.5
             C 75.5 105.5 67 109.5 59 109.5
             C 48 109.5 38 105.5 28 102
             C 18 98.5 8 100 -4 105 Z" fill="#ffffff"/>
  </g>
  <g fill="none" stroke="#0b4ea2" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M37.5 72.5 C 45 72.5 51 77 57 80 C 62 82.3 70 82 75 83 "/>
  </g>
  <path d="M80.3 86 L 95.5 75.6" fill="none" stroke="url(#dedos)" stroke-width="7" stroke-linecap="round"/>
  <path d="M37.5 72.5 C 30 72.5 20 78 10 85.5" fill="none" stroke="url(#pulso)" stroke-width="7" stroke-linecap="round"/>
</svg>
